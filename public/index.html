<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in &middot; Custom Outdoor Design</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <link rel="manifest" href="/app.webmanifest">
  <meta name="theme-color" content="#17402e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Outdoor">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="office">
  <main class="signin">
    <div class="card">
      <div class="crest">
        <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 4c4.6 5.4 7.6 9.4 7.6 13a7.6 7.6 0 0 1-15.2 0C8.4 13.4 11.4 9.4 16 4Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M16 12.6v7.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12.9 15.7 16 12.6l3.1 3.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 id="firm">Custom Outdoor Design</h1>
        <p>Sprinkler &middot; Lighting &middot; Drainage</p>
      </div>

      <div class="pad">
        <div id="flash" class="flash"></div>

        <form id="signin" autocomplete="on">
          <div class="field">
            <label for="username">Your name</label>
            <input id="username" name="username" autocomplete="username"
                   autocapitalize="none" autocorrect="off" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="pin">Your number</label>
            <input id="pin" name="pin" type="password" inputmode="numeric"
                   autocomplete="current-password" required>
          </div>
          <button class="go" type="submit">Sign in</button>
        </form>

        <p class="none" style="margin-top:14px">
          Forgot your number? Ask the office and they will set you a new one.
        </p>

        <p style="margin-top:10px">
          <a class="linkout" href="/install.html">Put this on your phone</a>
        </p>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/signin.js"></script>
</body>
</html>
