<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in &middot; Crew hours</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="signin">
    <div class="card">
      <div class="crest">
        <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3.2c4.9 5.6 8.6 10.4 8.6 14.6a8.6 8.6 0 0 1-17.2 0C7.4 13.6 11.1 8.8 16 3.2Z"
                fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M16 13.4v8.2" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M12.6 16.6 16 13.4l3.4 3.2" fill="none" stroke="currentColor"
                stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 id="firm">Crew hours</h1>
        <p>Irrigation &middot; Drainage &middot; Lighting</p>
      </div>

      <div class="pad">
        <div id="notice" class="notice"></div>

        <form id="signin" autocomplete="on">
          <div class="field">
            <label for="username">Your name</label>
            <input id="username" name="username" autocomplete="username"
                   autocapitalize="none" autocorrect="off" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="pin">Your number</label>
            <input id="pin" name="pin" type="password" inputmode="numeric"
                   autocomplete="current-password" required>
          </div>
          <button class="go" type="submit">Sign in</button>
        </form>

        <p class="none" style="margin-top:14px">
          Forgot your number? Ask the office and they will set you a new one.
        </p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
