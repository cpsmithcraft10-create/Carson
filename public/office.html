<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Office &middot; Custom Outdoor Design</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <link rel="manifest" href="/app.webmanifest">
  <meta name="theme-color" content="#17402e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Outdoor">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="office">
  <div class="app">
    <aside class="rail">
      <div class="rail-top">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 4c4.6 5.4 7.6 9.4 7.6 13a7.6 7.6 0 0 1-15.2 0C8.4 13.4 11.4 9.4 16 4Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M16 12.6v7.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M12.9 15.7 16 12.6l3.1 3.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
        <span class="mark" id="badge"></span>
      </div>

      <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-today" aria-selected="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
        </svg>
        <span>Today</span><span id="pip-today"></span>
      </button>
      <button role="tab" id="tab-week">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.8 5.2h12.4A1.8 1.8 0 0 1 20 7v11.4a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 18.4V7a1.8 1.8 0 0 1 1.8-1.8Z"/><path d="M4 9.8h16M8.6 3.6v3M15.4 3.6v3M9 13.4h6"/>
        </svg>
        <span>Week</span><span id="pip-week"></span>
      </button>
      <button role="tab" id="tab-hours">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3.8a8.2 8.2 0 1 0 0 16.4 8.2 8.2 0 0 0 0-16.4Z"/><path d="M12 7.4V12l3.1 1.9"/>
        </svg>
        <span>Hours</span><span id="pip-hours"></span>
      </button>
      <button role="tab" id="tab-leads">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.2 7.4h15.6v9.8a1.4 1.4 0 0 1-1.4 1.4H5.6a1.4 1.4 0 0 1-1.4-1.4Z"/><path d="m4.4 8 7.6 5.4L19.6 8"/>
        </svg>
        <span>Estimates</span><span id="pip-leads"></span>
      </button>
      <button role="tab" id="tab-jobs">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 4.5h6v2H9z"/><path d="M9 5.5H6.8A1.8 1.8 0 0 0 5 7.3v11.9A1.8 1.8 0 0 0 6.8 21h10.4a1.8 1.8 0 0 0 1.8-1.8V7.3a1.8 1.8 0 0 0-1.8-1.8H15"/><path d="M8.8 11.5h6.4M8.8 15.5h4.2"/>
        </svg>
        <span>Schedule</span><span id="pip-jobs"></span>
      </button>
      <button role="tab" id="tab-customers">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 20.5V9.8l7-5.3 7 5.3v10.7"/><path d="M3.4 20.5h17.2M9.8 20.5v-5.2h4.4v5.2"/>
        </svg>
        <span>Customers</span><span id="pip-customers"></span>
      </button>
      <button role="tab" id="tab-notices">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4.5 9.6v4.8h3.2l7 3.9V5.7l-7 3.9H4.5Z"/><path d="M18 9.4a3.8 3.8 0 0 1 0 5.2"/>
        </svg>
        <span>Notices</span><span id="pip-notices"></span>
      </button>
      <button role="tab" id="tab-crew">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.4 5.3a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Z"/><path d="M3.4 19.6c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"/><path d="M16.2 6.1a3.3 3.3 0 0 1 0 6.3M17.6 14.6c2 .7 3.2 2.4 3.2 5"/>
        </svg>
        <span>Team</span><span id="pip-crew"></span>
      </button>
      <button role="tab" id="tab-billing">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3.5h9.6L20 7.9V20a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 5 20V5A1.5 1.5 0 0 1 6.5 3.5Z"/><path d="M15 3.6V8h4.4M8.6 12.6h6.8M8.6 16.4h4.4"/>
        </svg>
        <span>Billing</span><span id="pip-billing"></span>
      </button>
      <button role="tab" id="tab-pay">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3.6v16.8"/><path d="M15.8 7.7c-.7-1.2-2.1-1.9-3.8-1.9-2.1 0-3.8 1-3.8 2.7 0 3.8 7.8 2 7.8 5.9 0 1.8-1.8 2.9-4 2.9-1.9 0-3.5-.8-4.1-2.2"/>
        </svg>
        <span>Payroll</span><span id="pip-pay"></span>
      </button>
      </nav>

      <div class="rail-foot">
        <span class="who" id="me"></span>
        <span id="signout"></span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <h1 id="screen">Today</h1>
        <input id="search" class="search" type="search" placeholder="Search customers and jobs"
               aria-label="Search customers and jobs" autocomplete="off">
      </header>

      <main id="sheet" class="sheet">
        <p class="none">Loading&hellip;</p>
      </main>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/office.js"></script>
</body>
</html>
