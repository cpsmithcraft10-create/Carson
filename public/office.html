<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Office &middot; Custom Outdoor Design</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Archivo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <span class="badge" id="badge"></span>
      <span class="me" id="me"></span>
      <span id="signout"></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-today" aria-selected="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
        </svg>
        <span>Today</span>
      </button>
      <button role="tab" id="tab-hours">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2"/><path d="M12 7.4V12l3.1 1.9"/>
        </svg>
        <span>Hours</span><span id="hours-pip"></span>
      </button>
      <button role="tab" id="tab-jobs">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="5.2" width="16" height="15" rx="1.8"/><path d="M4 9.8h16M8.6 3.6v3M15.4 3.6v3"/>
        </svg>
        <span>Give out work</span>
      </button>
      <button role="tab" id="tab-notices">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 9.6v4.8h3.2l7 3.9V5.7l-7 3.9H4.5Z"/><path d="M18 9.4a3.8 3.8 0 0 1 0 5.2"/>
        </svg>
        <span>Announcements</span>
      </button>
      <button role="tab" id="tab-crew">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9.4" cy="8.6" r="3.3"/><path d="M3.4 19.6c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"/><path d="M16.2 6.1a3.3 3.3 0 0 1 0 6.3M17.6 14.6c2 .7 3.2 2.4 3.2 5"/>
        </svg>
        <span>The crew</span>
      </button>
      <button role="tab" id="tab-pay">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.6v16.8"/><path d="M15.8 7.7c-.7-1.2-2.1-1.9-3.8-1.9-2.1 0-3.8 1-3.8 2.7 0 3.8 7.8 2 7.8 5.9 0 1.8-1.8 2.9-4 2.9-1.9 0-3.5-.8-4.1-2.2"/>
        </svg>
        <span>Payroll</span>
      </button>
    </nav>
  </header>

  <main id="sheet" class="sheet">
    <p class="none">Loading&hellip;</p>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/office.js"></script>
</body>
</html>
