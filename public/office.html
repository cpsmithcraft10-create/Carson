<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Office &middot; Crew hours</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <span class="mark">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3.2c4.9 5.6 8.6 10.4 8.6 14.6a8.6 8.6 0 0 1-17.2 0C7.4 13.6 11.1 8.8 16 3.2Z"
                fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M16 13.4v8.2" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M12.6 16.6 16 13.4l3.4 3.2" fill="none" stroke="currentColor"
                stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>
          <b id="firm">Crew hours</b>
          <span>Irrigation &middot; Drainage &middot; Lighting</span>
        </span>
      </span>
      <span class="me" id="me"></span>
      <span id="signout"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-day" aria-selected="true">The day</button>
      <button role="tab" id="tab-waiting">Waiting on you <span id="waiting-count"></span></button>
      <button role="tab" id="tab-work">Give out work</button>
      <button role="tab" id="tab-crew">The crew</button>
      <button role="tab" id="tab-pay">Payroll</button>
    </nav>
  </header>

  <main id="sheet" class="sheet">
    <p class="none">Loading&hellip;</p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/office.js"></script>
</body>
</html>
